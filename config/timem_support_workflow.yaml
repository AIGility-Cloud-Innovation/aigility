# TiMEM Space 客服工作流 (带只读检索 + 用户记忆读写)
# 角色: @persona/timem-support 委托执行
# 链路: retrieve(BM25 知识库) -> recall(记忆检索, seam 回调 dsh-plugin-timem) -> ask(llm_node) -> save(记忆写入)
workflow:
  name: "timem-support-workflow"
  description: "TiMEM Space 客服: 知识库检索 + 用户记忆召回 + LLM 回答 + 记忆保存"
  entry_point: "retrieve"

  nodes:
    retrieve:
      type: "function_node"
      description: "知识库 BM25 检索"
      function_ref: "retrieve_node"
      output_keys: ["retrieved_context"]

    recall:
      type: "capability_node"
      description: "用户记忆召回 (timem.cloud)"
      capability_ref: "@cognitive/timem-memory"
      output_keys: ["memory_context"]

    ask:
      type: "llm_node"
      description: "带检索+记忆上下文回答"
      prompt_ref: "aigility.timem_support_prompts.TIMEM_SUPPORT_SYSTEM_PROMPT"
      output_keys: ["result"]

    save:
      type: "capability_node"
      description: "回答后保存记忆 (timem.cloud)"
      capability_ref: "@cognitive/timem-memory-write"
      output_keys: ["save_result"]

  flow:
    edges:
      - from: "retrieve"
        to: "recall"
      - from: "recall"
        to: "ask"
      - from: "ask"
        to: "save"
      - from: "save"
        to: "__end__"