# aigility-harness 框架介绍员工作流
# 角色: @persona/harness-guide 委托执行, llm_node 调 LiteLLM 网关真实回答
workflow:
  name: "harness-guide-workflow"
  description: "aigility-harness 框架介绍: 收用户问题 → llm_node 生成回答 → 返回"
  entry_point: "ask"

  nodes:
    ask:
      type: "llm_node"
      description: "框架介绍 LLM 节点"
      prompt_ref: "aigility.harness_guide_prompts.SYSTEM_PROMPT"
      output_keys: ["result"]

  flow:
    edges:
      - from: "ask"
        to: "__end__"