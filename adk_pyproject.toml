[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigility-adk"
version = "0.0.1"
description = "AIGility ADK - Agent Development Kit | 基于 LangGraph/LangChain 的智能体开发框架"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
maintainers = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
keywords = ["adk", "agent", "langchain", "langgraph", "workflow", "chat", "rag", "memory", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/AIGility-Cloud-Innovation/aigility-adk"
Documentation = "https://aigility-adk.readthedocs.io"
Repository = "https://github.com/AIGility-Cloud-Innovation/aigility-adk"
Issues = "https://github.com/AIGility-Cloud-Innovation/aigility-adk/issues"
Changelog = "https://github.com/AIGility-Cloud-Innovation/aigility-adk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["adk*"]

[tool.setuptools.package-data]
adk = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["adk"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
asyncio_mode = "auto"

