# iMA Docker Compose 部署配置
# 工业智能报警分析平台 - Neo4j + MySQL + Redis + 前后端服务

volumes:
  neo4j_data:
    name: "${PROJECT_NAME:-ima}_neo4j_data"
  neo4j_logs:
    name: "${PROJECT_NAME:-ima}_neo4j_logs"
  neo4j_import:
    name: "${PROJECT_NAME:-ima}_neo4j_import"
  neo4j_plugins:
    name: "${PROJECT_NAME:-ima}_neo4j_plugins"
  mysql_data:
    name: "${PROJECT_NAME:-ima}_mysql_data"
  redis_data:
    name: "${PROJECT_NAME:-ima}_redis_data"
  app_logs:
    name: "${PROJECT_NAME:-ima}_app_logs"

networks:
  project-network:
    name: "${PROJECT_NAME:-ima}_network"
    driver: bridge

services:
  # Autoheal - 自动重启 unhealthy 容器
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: "${PROJECT_NAME:-ima}_autoheal"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal_${PROJECT_NAME:-ima}
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_DEFAULT_TIMEOUT=30
    networks:
      - project-network
    restart: unless-stopped

  # Neo4j 图数据库
  neo4j:
    image: neo4j:2026.07.1
    container_name: "${PROJECT_NAME:-ima}_neo4j"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_dbms_default__database: ${NEO4J_DATABASE:-neo4j}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_dbms_connector_bolt_advertised__address: neo4j:7687
      NEO4J_dbms_connector_http_advertised__address: neo4j:7474
    networks:
      - project-network
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j123}", "RETURN 1"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped
    labels:
      - autoheal_${PROJECT_NAME:-ima}=true

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: "${PROJECT_NAME:-ima}_mysql"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-industry_agent}
      MYSQL_USER: ${DB_USER:-ima_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ima123}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    networks:
      - project-network
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123}"]
      timeout: 5s
      retries: 5
      interval: 15s
      start_period: 30s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    labels:
      - autoheal_${PROJECT_NAME:-ima}=true

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: "${PROJECT_NAME:-ima}_redis"
    networks:
      - project-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 3
      interval: 10s
      start_period: 10s
    restart: unless-stopped
    command: redis-server --appendonly yes
    labels:
      - autoheal_${PROJECT_NAME:-ima}=true

  # 前端服务（生产构建：npm run build → nginx 托管静态资源）
  frontend:
    pull_policy: never # 禁用拉取，直接构建
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        COMMIT: ${COMMIT:-latest}
        ENV_FILE: .env.${ENV_SUFFIX:-production}
    image: "${PROJECT_NAME:-ima}_frontend:${COMMIT:-latest}"
    container_name: "${PROJECT_NAME:-ima}_frontend"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      timeout: 5s
      retries: 3
      interval: 30s
      start_period: 10s
    restart: unless-stopped
    labels:
      - autoheal_${PROJECT_NAME:-ima}=true

  # 后端服务
  app:
    pull_policy: never # 禁用拉取，直接构建
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
        COMMIT: ${COMMIT:-latest}
    image: "${PROJECT_NAME:-ima}_app:${COMMIT:-latest}"
    container_name: "${PROJECT_NAME:-ima}_app"
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123}
      # MySQL
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USER:-ima_user}
      DB_PASSWORD: ${DB_PASSWORD:-ima123}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - project-network
    volumes:
      - app_logs:/app/logs
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD-SHELL", 'for p in /health /ready /healthy /docs; do python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000''+''$$p'',timeout=3)" && break; done']
      timeout: 5s
      retries: 3
      interval: 30s
      start_period: 40s
    restart: unless-stopped
    labels:
      - autoheal_${PROJECT_NAME:-ima}=true
