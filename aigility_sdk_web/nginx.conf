server {
    listen 3000;
    server_name _;

    # 文件上传大小限制（Excel/Cypher 导入）
    client_max_body_size 50m;

    # 静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json image/svg+xml;

    # 静态资源缓存（带 hash 的文件长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：所有未匹配的路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

}
