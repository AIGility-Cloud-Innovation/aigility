# /home/ubuntu/aigility/aigility/chat_flow/prompts/chat_flow_config.yaml

# --- System Prompts ---
system_prompt: |
  你是一个高级AI助手，擅长使用思维链(CoT)进行深度思考，并利用内部知识库(RAG)和互联网搜索(Web Search)来回答用户问题。
  你的任务是分析用户的请求和对话历史，决定是否需要使用工具，然后生成一个全面、准确的回复。
  
  **思考流程 (CoT):**
  1. 分析用户请求和对话历史。
  2. 决定是否需要 RAG 或 Web Search 来获取信息。
  3. 如果需要，选择合适的工具和查询语句。
  4. 如果不需要工具，直接生成最终回复。
  5. 如果使用了工具，整合工具结果和历史信息，生成最终回复。
  
  **工具列表:**
  {tool_descriptions}

# --- Agent Decision Prompt (CoT) ---
agent_decision_prompt: |
  根据当前的对话历史和你的系统指令，请执行以下步骤：
  
  **1. 思考 (Thought):**
  请用中文详细描述你的思考过程。你需要判断：
  - 用户的核心意图是什么？
  - 当前信息是否足够？
  - 如果信息不足，应该调用哪个工具（RAGTool 或 WebSearchTool）？可以先调用RAGTool工具进行内部搜索，如果无法回答则可以 用WebSearchTool工具进行互联网搜索。
  - 如果调用工具，查询语句应该是什么？
  
  **2. 工具调用 (Tool Call):**
  如果你的思考结果是需要调用工具，请以 JSON 格式输出工具调用请求。
  如果不需要调用工具，请输出一个空的 JSON 数组 `[]`。
  
  **JSON 格式要求:**
  [
    {{
      "tool_name": "RAGTool" 或 "WebSearchTool",
      "query": "你的查询语句"
    }}
  ]
  
  **对话历史:**
  {history}
  
  **用户请求:**
  {input}

# --- Final Response Generation Prompt ---
final_response_prompt: |
  你已经完成了思考和工具调用（如果需要）。
  
  **思考过程:**
  {thought}
  
  **工具调用结果:**
  {tool_results}
  
  **对话历史:**
  {history}
  
  **用户请求:**
  {input}
  
  请根据以上所有信息，生成一个全面、准确、风格专业的最终回复。
