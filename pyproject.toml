[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigility"
version = "0.0.4"
description = "A modern Python ADK - Agent Development Kit for building AI agents with LangGraph and LangChain. This library provides a comprehensive, type-safe framework for developing intelligent agents with chat, workflow, memory, and knowledge management capabilities."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
maintainers = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
keywords = ["adk", "agent", "langchain", "langgraph", "workflow", "chat", "rag", "memory", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-huggingface>=0.0.1",
    "langchain-chroma>=0.1.0",
    "python-docx>=0.8.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.9.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "openpyxl>=3.1.0",
    "jieba>=0.42.0",
    "scikit-learn>=1.0.0",
    "timem-ai>=0.1.0",
    "zai-sdk>=0.2.0",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
# RAG module dependencies
rag = [
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
]

# Embedding model dependencies
embedding-huggingface = [
    "sentence-transformers>=2.2.0",
    "langchain-huggingface>=0.0.1",
]
embedding-dashscope = [
    "openai>=1.0.0",
    "langchain-openai>=0.0.5",
]

# Vector store dependencies
vectorstore-chroma = [
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
]
vectorstore-faiss = [
    "faiss-cpu>=1.7.0",
    "langchain-community>=0.0.20",
]
vectorstore-milvus = [
    "pymilvus>=2.3.0",
    "langchain-milvus>=0.1.0",
]

# Document processing dependencies
doc-pdf = [
    "pdfplumber>=0.9.0",
]
doc-word = [
    "python-docx>=0.8.0",
]
nlp = [
    "jieba>=0.42.0",
    "scikit-learn>=1.0.0",
]

# Full RAG functionality (recommended)
rag-full = [
    "aigility[rag]",
    "aigility[embedding-huggingface]",
    "aigility[vectorstore-chroma]",
    "aigility[doc-pdf]",
    "aigility[doc-word]",
    "aigility[nlp]",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/AIGility-Cloud-Innovation/aigility"
Documentation = "https://aigility.readthedocs.io"
Repository = "https://github.com/AIGility-Cloud-Innovation/aigility"
Issues = "https://github.com/AIGility-Cloud-Innovation/aigility/issues"
Changelog = "https://github.com/AIGility-Cloud-Innovation/aigility/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["aigility*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
aigility = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["aigility"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that require external integration services",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
asyncio_mode = "auto"

