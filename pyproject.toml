[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigility"
version = "0.1.3"
description = "A modern Python ADK - Agent Development Kit for building AI agents with LangGraph and LangChain. This library provides a comprehensive, type-safe framework for developing intelligent agents with chat, workflow, memory, and knowledge management capabilities."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
maintainers = [
    {name = "AIGility Cloud Innovation", email = "contact@aigility.com"}
]
keywords = ["adk", "agent", "langchain", "langgraph", "workflow", "chat", "rag", "memory", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.0.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-openai>=0.0.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# ============================================================
# 核心增强功能 (Core enhancements)
# ============================================================
# Anthropic LLM support
anthropic = [
    "langchain-anthropic>=0.1.0",
]

# ============================================================
# RAG 功能模块 (RAG features)
# ============================================================
# RAG 核心依赖 (最小RAG功能)
rag = [
    "langchain-community>=0.0.20",
    "langchain-text-splitters>=0.1.0",
    "rank-bm25>=0.2.0",
]

# Embedding 模型支持
embedding-huggingface = [
    "sentence-transformers>=2.2.0",
    "langchain-huggingface>=0.0.1",
]
embedding-dashscope = [
    "dashscope>=1.16.0",
]
rerank-dashscope = [
    "dashscope>=1.16.0",
]

# 向量库支持
vectorstore-chroma = [
    "chromadb>=0.4.0",
    "langchain-chroma>=0.1.0",
]
vectorstore-faiss = [
    "faiss-cpu>=1.7.0",
    "langchain-community>=0.0.20",
]
vectorstore-milvus = [
    "pymilvus>=2.3.0",
    "langchain-milvus>=0.1.0",
]
vectorstore-qdrant = [
    "qdrant-client>=1.7.0",
    "langchain-community>=0.0.20",
]

# 文档处理支持
doc-pdf = [
    "pdfplumber>=0.9.0",
]
doc-word = [
    "python-docx>=0.8.0",
]
doc-excel = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]
doc-markdown = [
    "markdown-it-py>=3.0.0",
]

# NLP 处理支持
nlp = [
    "jieba>=0.42.0",
    "scikit-learn>=1.0.0",
]

# ============================================================
# 第三方服务集成 (Third-party services)
# ============================================================
# TiMEM Memory Provider SDK
timem = [
    "timem-ai>=0.1.6",
]
# 太忆 RAG 完整功能 (太忆 + 文档处理)
timem-rag = [
    "aigility[timem]",
    "aigility[doc-pdf]",
    "aigility[doc-word]",
    "aigility[doc-excel]",
    "aigility[nlp]",
]
# 在智 embedding 服务
zai = [
    "zai-sdk>=0.2.0",
]

# ============================================================
# 完整功能组合 (Complete feature bundles)
# ============================================================
# 完整 RAG 功能 (使用本地 HuggingFace + Chroma)
rag-local = [
    "aigility[rag]",
    "aigility[embedding-huggingface]",
    "aigility[vectorstore-chroma]",
    "aigility[doc-pdf]",
    "aigility[doc-word]",
    "aigility[doc-excel]",
    "aigility[doc-markdown]",
    "aigility[nlp]",
]

# 完整 RAG 功能 (使用 Qdrant)
rag-qdrant = [
    "aigility[rag]",
    "aigility[vectorstore-qdrant]",
    "aigility[doc-pdf]",
    "aigility[doc-word]",
    "aigility[doc-excel]",
    "aigility[doc-markdown]",
    "aigility[nlp]",
]

# 全功能 (包含所有可选功能)
all = [
    "aigility[anthropic]",
    "aigility[embedding-dashscope]",
    "aigility[rag-local]",
    "aigility[rerank-dashscope]",
    "aigility[timem-rag]",
    "aigility[vectorstore-faiss]",
    "aigility[vectorstore-milvus]",
    "aigility[vectorstore-qdrant]",
    "aigility[zai]",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.20.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/AIGility-Cloud-Innovation/aigility"
Documentation = "https://aigility.readthedocs.io"
Repository = "https://github.com/AIGility-Cloud-Innovation/aigility"
Issues = "https://github.com/AIGility-Cloud-Innovation/aigility/issues"
Changelog = "https://github.com/AIGility-Cloud-Innovation/aigility/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["aigility*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
aigility = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["aigility"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-m",
    "not integration and not optional_timem and not optional_dashscope and not optional_doc_pdf and not optional_doc_word and not optional_doc_excel and not optional_doc_markdown and not optional_rag",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services",
    "optional_timem: tests that require the timem optional dependency",
    "optional_dashscope: tests that require a DashScope optional dependency",
    "optional_doc_pdf: tests that require the doc-pdf optional dependency",
    "optional_doc_word: tests that require the doc-word optional dependency",
    "optional_doc_excel: tests that require the doc-excel optional dependency",
    "optional_doc_markdown: tests that require the doc-markdown optional dependency",
    "optional_rag: tests that require the rag optional dependency",
]
